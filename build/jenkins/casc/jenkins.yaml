# Jenkins Configuration-as-Code for Wonderland's controller.
#
# `flag` is a GLOBAL-scope string credential — Wonderland's release token. The deploy pipeline binds
# it and prints it, but only once a publicly-readable bucket actually reaches deployment (CICD-SEC-1:
# the security scan is the only thing standing between a malicious change and that deploy). Its value
# is NOT in this file and NOT in the image; it is resolved at boot from a file secret (`${flag}` ->
# $SECRETS/flag), which the entrypoint stages from the per-player input Isoloom mounts at run time.
jenkins:
  systemMessage: "Wonderland CI — scans and deploys the dodo bucket on every push to main."
  numExecutors: 1
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "admin"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

security:
  globalJobDslSecurityConfiguration:
    useScriptSecurity: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              id: "flag"
              scope: GLOBAL
              secret: "${flag}"
              description: "Wonderland release token — keep secret"
          - usernamePassword:
              id: "gitea-jenkins"
              scope: GLOBAL
              username: "jenkins"
              password: "jenkins"
              description: "Gitea read access for polling repositories"

unclassified:
  location:
    url: "http://jenkins:8080/"

jobs:
  - file: /usr/share/jenkins/casc/jobdsl/dodo.groovy
